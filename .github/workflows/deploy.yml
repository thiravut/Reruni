name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  BUN_VERSION: "1.1.34"

jobs:
  build:
    name: build artifacts
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # ---------------- server (Go, linux/amd64) ---------------------------
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: go test
        working-directory: server
        run: go test ./...

      - name: go build
        working-directory: server
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.gitSHA=${{ steps.meta.outputs.sha }}" \
            -o ../artifacts/server .

      # ---------------- portal + backoffice (Bun + Vite) -------------------
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: build portal
        working-directory: portal
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../artifacts/portal
          cp -r dist/. ../artifacts/portal/

      - name: build backoffice
        working-directory: backoffice
        run: |
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../artifacts/backoffice
          cp -r dist/. ../artifacts/backoffice/

      - name: ship deploy script alongside artifacts
        run: cp deploy/deploy.sh artifacts/deploy.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.sha }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  deploy:
    name: deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.sha }}
          path: artifacts/

      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: rsync release to VPS
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          chmod +x artifacts/server artifacts/deploy.sh
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "sudo install -d -o $SSH_USER -g $SSH_USER /opt/rerun/releases/$SHA"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            artifacts/server      "$SSH_USER@$SSH_HOST:/opt/rerun/releases/$SHA/server"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            artifacts/portal/     "$SSH_USER@$SSH_HOST:/opt/rerun/releases/$SHA/portal/"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            artifacts/backoffice/ "$SSH_USER@$SSH_HOST:/opt/rerun/releases/$SHA/backoffice/"
          rsync -az          -e "ssh -i ~/.ssh/id_ed25519" \
            artifacts/deploy.sh   "$SSH_USER@$SSH_HOST:/opt/rerun/releases/$SHA/deploy.sh"

      - name: switch release + health check
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            "sudo /opt/rerun/releases/$SHA/deploy.sh $SHA"
