name: deploy

# Push to main triggers a build + restart on the production VPS. CI is the
# doorbell — actual build, migrate, restart, and health-check run on the box
# itself via `deploy/server-deploy.sh`.
#
# Required repo secrets:
#   DEPLOY_HOST        — VPS IP or hostname
#   DEPLOY_USER        — reruni
#   DEPLOY_SSH_KEY     — private key (GH-Actions → server side)
#   DEPLOY_KNOWN_HOSTS — output of `ssh-keyscan -t ed25519 <VPS-IP>`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: pull + build + restart on server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: deploy
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          cd ~/rerun-src
          # Keep sparse-checkout list in sync with what deploy actually needs.
          git sparse-checkout set server portal backoffice deploy landing
          git fetch --prune
          git pull --ff-only
          bash deploy/server-deploy.sh
          EOSSH
