name: deploy

# Push to main triggers a pull on the production VPS. The VPS itself owns
# building + restarting — this workflow is just the doorbell.
#
# Required repo secrets:
#   DEPLOY_HOST        — VPS IP or hostname
#   DEPLOY_USER        — reruni
#   DEPLOY_SSH_KEY     — private key (the GH-Actions → server side, NOT the
#                        GitHub Deploy Key used by the server to pull from GitHub)
#   DEPLOY_KNOWN_HOSTS — output of `ssh-keyscan -t ed25519 <VPS-IP>`

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: pull on server
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: pull latest on server
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$SSH_USER@$SSH_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          cd ~/rerun-src
          git fetch --prune
          git pull --ff-only
          echo "deployed: $(git rev-parse --short HEAD) — $(git log -1 --format='%s')"
          EOSSH
